site_name: phileas-python
site_description: A Python library to deidentify and redact PII, PHI, and other sensitive information from text
site_url: https://philterd.github.io/phileas-python/
copyright: >-
  &copy; Philterd, LLC. "Phileas" and "Philter" are registered trademarks of
  Philterd, LLC. Licensed under the Apache License, Version 2.0.

repo_name: philterd/phileas-python
repo_url: https://github.com/philterd/phileas-python

docs_dir: docs

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick Start: quickstart.md
  - Policies: policies.md
  - Filters: filters.md
  - Examples: examples.md
  - CLI: cli.md
  - API Reference: api-reference.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
